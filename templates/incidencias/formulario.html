{% extends "base.html" %}
{% block titulo %}Nueva incidencia{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">Nueva incidencia</h1>
<form method="post" class="card card-body">
  {% csrf_token %}
  {% for campo in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% for error in campo.errors %}
      <div class="text-danger small">{{ error }}</div>
    {% endfor %}
  </div>
  {% endfor %}
  <div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'incidencias:lista' %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
